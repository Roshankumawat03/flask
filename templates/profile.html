<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if title %}
        <title>My Blog | {{ title }}</title>
    {% else %}
        <title>My Blog</title>
    {% endif %}        
</head>
<body>
   <div class="container">
        <div>
            <div>Name</div>
            <div>{{name}}</div>
        </div>
        <div>
            <div>Username</div>
            <div>{{username}}</div>
        </div>
        <div>
            <div>Mail</div>
            <div>{{email}}</div>
        </div>
        <div>
            <div>Photo</div>
            <div>
                <img src="{{url_for('static', filename=profile_photo)}}" alt="Dp">
            </div>
        </div>
</div>
</body>
</html>
